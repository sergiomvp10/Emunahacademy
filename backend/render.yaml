databases:
  - name: emunahacademy-db
    databaseName: emunahacademy
    user: emunahacademy
    plan: starter

services:
  - type: web
    name: emunahacademy-api
    runtime: python
    plan: starter
    buildCommand: pip install poetry && poetry install
    startCommand: poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: emunahacademy-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
      # Cloudflare R2 object storage (primary file backend once set).
      # Leaving any of these empty falls back to the local persistent disk.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
